# Docker Compose for AegisEdgeAI ARM64 Deployment
version: '3.8'

services:
  aegis-edge-ai:
    build:
      context: .
      dockerfile: Dockerfile.arm64
      platforms:
        - linux/arm64
    container_name: aegis-edge-ai-arm64
    restart: unless-stopped
    
    # Environment variables
    environment:
      - ARCH=aarch64
      - PREFIX=/usr/local
      - TPM2TOOLS_TCTI=swtpm:host=127.0.0.1,port=2321
      - PYTHONPATH=/app
      - FLASK_ENV=production
    
    # Port mappings
    ports:
      - "5000:5000"  # Agent service
      - "5001:5001"  # Collector service  
      - "5002:5002"  # Gateway service
      - "2321:2321"  # TPM control port
      - "2322:2322"  # TPM data port
    
    # Volume mounts for persistence
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - tpm-state:/var/lib/swtpm-localca
      - ./zero-trust/config.py:/app/zero-trust/config.py:ro
    
    # Resource limits for edge devices
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Networking
    networks:
      - aegis-network
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Optional: Monitoring service for ARM64
  monitoring:
    image: prom/prometheus:latest
    container_name: aegis-monitoring-arm64
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - aegis-network
    depends_on:
      - aegis-edge-ai

volumes:
  tpm-state:
    driver: local
  prometheus-data:
    driver: local

networks:
  aegis-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16